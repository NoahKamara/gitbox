[workspace]
resolver = "3"
members = [
    "crates/gitbox",
    "crates/gitbox-core",
    "crates/gitboxd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gitbox-core = { path = "crates/gitbox-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.12"
